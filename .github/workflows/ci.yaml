name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      fail-fast: false
      matrix:
        operating-system:
          - 'ubuntu-latest'
        php:
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
        symfony:
          - '4.*'
          - '5.*'
          - '6.*'
          - '7.*'
        dependency:
          - 'lowest'
          - 'highest'

        # Exclude invalid combinations
        exclude:
          # Symfony 6.* requires PHP >= 8.0.2
          - php: '7.4'
            symfony: '6.*'

          # Symfony 7.* requires PHP >= 8.2
          - php: '7.4'
            symfony: '7.*'
          - php: '8.0'
            symfony: '7.*'
          - php: '8.1'
            symfony: '7.*'

    name: PHP ${{ matrix.php }} with Symfony ${{ matrix.symfony }} (${{ matrix.dependency }} dependencies) on ${{ matrix.operating-system }}

    steps:
      - name: Setup PHP version ${{ matrix.php }} on ${{ matrix.operating-system }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: flex

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ramsey/composer-install@v2
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        with:
          dependency-versions: ${{ matrix.dependency }}
          composer-options: "--no-audit"

      - name: Run all tests
        run: composer test
